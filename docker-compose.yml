services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=models/modelo_mnist.keras
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
    volumes:
      - ./api/models:/app/models  # Montar modelos sin reconstruir imagen
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3