<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNIST - AI Classifier</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            color: #1a1a2e;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: #1a1a2e;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .main-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 2rem;
            display: flex;
            gap: 2rem;
            max-width: 760px;
            width: 100%;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .canvas-wrapper {
            position: relative;
        }

        canvas {
            border: 2px solid #e0e0e0;
            background: #111;
            cursor: crosshair;
            border-radius: 12px;
            display: block;
            touch-action: none;
        }

        canvas:hover { border-color: #888; }

        .canvas-hint {
            font-size: 0.75rem;
            color: #aaa;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }

        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #predict-btn {
            background: #2563eb;
            color: white;
        }

        #predict-btn:hover:not(:disabled) { background: #1d4ed8; }

        #clear-btn {
            background: #f1f5f9;
            color: #374151;
            border: 1px solid #e2e8f0;
        }

        #clear-btn:hover { background: #e2e8f0; }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-width: 0;
        }

        .result-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 1.25rem;
            text-align: center;
            border: 1px solid #e2e8f0;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .result-placeholder {
            color: #aaa;
            font-size: 0.9rem;
        }

        .result-digit {
            font-size: 4rem;
            font-weight: 700;
            color: #2563eb;
            line-height: 1;
        }

        .result-confidence {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        .result-confidence span {
            font-weight: 600;
            color: #16a34a;
        }

        .bars-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .bars-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }

        .bar-label {
            width: 14px;
            font-weight: 600;
            color: #374151;
            text-align: right;
            flex-shrink: 0;
        }

        .bar-track {
            flex: 1;
            background: #f1f5f9;
            height: 18px;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 4px;
            background: #cbd5e1;
            transition: width 0.4s ease;
        }

        .bar-fill.winner {
            background: #2563eb;
        }

        .bar-pct {
            width: 38px;
            text-align: right;
            color: #64748b;
            flex-shrink: 0;
        }

        .bar-pct.winner {
            color: #2563eb;
            font-weight: 600;
        }

        .error-msg {
            color: #dc2626;
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 580px) {
            .main-card {
                flex-direction: column;
                align-items: center;
            }
            .right-panel { width: 100%; }
        }
    </style>
</head>
<body>

    <h1>Clasificador de Dígitos</h1>
    <p class="subtitle">Dibuja un número del 0 al 9 y la red neuronal lo clasificará</p>

    <div class="main-card">
        <div class="left-panel">
            <canvas id="canvas" width="240" height="240"></canvas>
            <p class="canvas-hint">Dibuja con el mouse o con el dedo</p>
            <div class="controls">
                <button id="clear-btn">Limpiar</button>
                <button id="predict-btn">Predecir</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="result-box" id="result-box">
                <p class="result-placeholder" id="result-placeholder">Dibuja un número y presiona Predecir</p>
                <div id="result-content" style="display:none;">
                    <div class="result-digit" id="result-digit"></div>
                    <div class="result-confidence">Confianza: <span id="result-conf"></span></div>
                </div>
            </div>

            <p class="bars-title">Distribución de probabilidad</p>
            <div class="bars-container" id="bars-container">
                <!-- Se genera dinámicamente -->
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:8000'
            : `http://${window.location.hostname}:8000`;

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;
        let hasDrawing = false;

        ctx.strokeStyle = "white";
        ctx.lineWidth = 18;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const src = e.touches ? e.touches[0] : e;
            return {
                x: (src.clientX - rect.left) * scaleX,
                y: (src.clientY - rect.top) * scaleY
            };
        }

        function startDraw(e) {
            drawing = true;
            hasDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function draw(e) {
            if (!drawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();
        }

        function stopDraw(e) {
            drawing = false;
            ctx.beginPath();
            e.preventDefault();
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDraw, { passive: false });

        document.getElementById('clear-btn').onclick = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasDrawing = false;
            document.getElementById('result-placeholder').style.display = '';
            document.getElementById('result-content').style.display = 'none';
            renderBars(null);
        };

        document.getElementById('predict-btn').onclick = async () => {
            if (!hasDrawing) return;

            const btn = document.getElementById('predict-btn');
            btn.innerText = "Analizando...";
            btn.disabled = true;

            try {
                const dataURL = canvas.toDataURL('image/png');
                const response = await fetch(`${API_URL}/api/v1/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_base64: dataURL })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Error del servidor');
                }

                const data = await response.json();
                renderResult(data);

            } catch (err) {
                document.getElementById('result-placeholder').style.display = '';
                document.getElementById('result-placeholder').innerHTML = `<span class="error-msg">Error: ${err.message}</span>`;
                document.getElementById('result-content').style.display = 'none';
            } finally {
                btn.innerText = "Predecir";
                btn.disabled = false;
            }
        };

        function renderResult(data) {
            document.getElementById('result-placeholder').style.display = 'none';
            document.getElementById('result-content').style.display = '';
            document.getElementById('result-digit').innerText = data.predicted_class;
            document.getElementById('result-conf').innerText = (data.confidence * 100).toFixed(1) + '%';
            renderBars(data);
        }

        function renderBars(data) {
            const container = document.getElementById('bars-container');
            if (!data) {
                container.innerHTML = '';
                for (let i = 0; i < 10; i++) {
                    container.innerHTML += `
                        <div class="bar-row">
                            <span class="bar-label">${i}</span>
                            <div class="bar-track"><div class="bar-fill" style="width:0%"></div></div>
                            <span class="bar-pct">—</span>
                        </div>`;
                }
                return;
            }

            container.innerHTML = '';
            data.probabilities.forEach((p, i) => {
                const isWinner = i === data.predicted_class;
                const pct = (p * 100).toFixed(1);
                container.innerHTML += `
                    <div class="bar-row">
                        <span class="bar-label">${i}</span>
                        <div class="bar-track">
                            <div class="bar-fill ${isWinner ? 'winner' : ''}" style="width:${pct}%"></div>
                        </div>
                        <span class="bar-pct ${isWinner ? 'winner' : ''}">${pct}%</span>
                    </div>`;
            });
        }

        renderBars(null);
    </script>
</body>
</html>
